[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-stats"
version = "1.18.0"
description = "Local-first usage dashboard and leaderboard for AI coding agent sessions: tokens, cost and activity across Codex, OpenCode, Claude Code, Hermes and DeepSeek Harness, read straight from the databases those tools already keep on your machine."
readme = "README.md"
requires-python = ">=3.11"
# dsh writes its session logs zstd-compressed by default. Python 3.14 ships
# zstd in the standard library; older interpreters need the third-party
# package or every compressed dsh session is silently skipped.
dependencies = [
  "zstandard>=0.22; python_version < '3.14'",
]
# SPDX form (PEP 639). The License classifier is deliberately absent: setuptools
# rejects having both, and the old license = { text = ... } table is deprecated.
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Vivek" }
]
keywords = [
  "ai",
  "analytics",
  "claude",
  "cli",
  "codex",
  "cost",
  "dashboard",
  "developer-tools",
  "hermes",
  "leaderboard",
  "local-first",
  "metrics",
  "observability",
  "opencode",
  "privacy",
  "reporting",
  "sqlite",
  "terminal",
  "tokens",
  "usage",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Monitoring",
  "Topic :: Utilities",
]
# "Typing :: Typed" is deliberately absent: it promises an inline py.typed
# marker, and the package does not ship one. Add both together if that changes.

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "coverage[toml]>=7.6",
  "mypy>=1.10",
  "ruff>=0.6",
]

[project.scripts]
codex-stats = "codex_stats.cli:main"

[project.urls]
Homepage = "https://github.com/vivek378521/codex-stats"
Repository = "https://github.com/vivek378521/codex-stats"
Issues = "https://github.com/vivek378521/codex-stats/issues"
Changelog = "https://github.com/vivek378521/codex-stats/blob/main/CHANGELOG.md"
Leaderboard = "https://codex-stats-leaderboard.vercel.app"
Funding = "https://github.com/sponsors/vivek378521"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["src/codex_stats"]

[tool.coverage.run]
source = ["codex_stats"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
